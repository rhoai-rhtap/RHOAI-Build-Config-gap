name: Trigger Early Gate Tests

# Queues the RHOAI early-gate smoke test on Jenkins and prints the queue URL
# so the Konflux task that dispatched this workflow can find the job again.
#
# Adapted from red-hat-data-services/rhods-devops-infra's workflow of the same
# name. Two differences, both following from the RHOAI early gate resolving
# its images to digests before it gets here:
#
#   1. Upstream takes one `fbc_tag` input and forwards it to Jenkins as
#      RHOAI_VERSION, so the tag doubles as both the release identifier and
#      the thing that locates the catalog. That conflates two facts and makes
#      the catalog a mutable reference. Here the release line and the three
#      images are separate inputs, and the images are digests.
#
#   2. The three image references are forwarded to Jenkins as OPERATOR_IMAGE,
#      BUNDLE_IMAGE and FBC_IMAGE. See the note above the Jenkins call about
#      what has to exist on the Jenkins side for those to take effect.
#
# This file lives in the POC fork rather than in rhods-devops-infra because
# that is where the early gate's eg-github-token already has actions:write.
# Promoting it means moving it to rhods-devops-infra and pointing the
# github-workflow-repo param there.

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: "Comma-separated component repository names under test"
        required: true
        type: string
      pr_number:
        description: "Leader PR number"
        required: true
        type: string
      correlation_id:
        description: "Correlation ID, eg-<pr>-<epoch>"
        required: true
        type: string
      rhoai_version:
        description: "Release line under test, e.g. 3.6.0"
        required: false
        type: string
        default: ""
      fbc_image:
        description: "FBC fragment by digest. The catalog the test installs from."
        required: false
        type: string
        default: ""
      bundle_image:
        description: "Bundle image by digest. Reported, not installed."
        required: false
        type: string
        default: ""
      operator_image:
        description: "Operator image by digest. Reported, not installed."
        required: false
        type: string
        default: ""

permissions:
  contents: read

run-name: 'Early Gate smoke test for PR #${{ inputs.pr_number }} (${{ inputs.correlation_id }})'

jobs:
  trigger-jenkins:
    # The Jenkins host is on Red Hat's internal network, which a
    # GitHub-hosted runner cannot route to. Production needs
    # EG_RUNNER_LABELS set to a self-hosted label with that reach; the
    # ubuntu-latest fallback exists so the dispatch plumbing either side of
    # the Jenkins call can be exercised in a fork that has no such runner,
    # where the curl below will fail to connect and say so plainly.
    #
    # There is deliberately no `environment:` key. Upstream pins this job to
    # the redhat-internal environment, which is where its Jenkins credentials
    # are scoped. An environment name cannot be made conditional - an empty
    # string is a validation error, not an opt-out - so pinning one here
    # would make the file unusable in any repository that has not created it
    # first. Whoever promotes this to rhods-devops-infra adds the key back;
    # in the POC fork the credentials are repository-level secrets.
    runs-on: ${{ vars.EG_RUNNER_LABELS || 'ubuntu-latest' }}
    env:
      JENKINS_BASE_URL: ${{ vars.JENKINS_BASE_URL }}
      JENKINS_JOB_PATH: ${{ vars.JENKINS_JOB_PATH || 'job/devops/job/early-gate-tests' }}
      REPOSITORIES: ${{ inputs.repositories }}
      PR_NUMBER: ${{ inputs.pr_number }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
      RHOAI_VERSION: ${{ inputs.rhoai_version }}
      FBC_IMAGE: ${{ inputs.fbc_image }}
      BUNDLE_IMAGE: ${{ inputs.bundle_image }}
      OPERATOR_IMAGE: ${{ inputs.operator_image }}
    steps:
      - name: Print inputs
        run: |
          echo "Repositories:   ${REPOSITORIES}"
          echo "PR number:      ${PR_NUMBER}"
          echo "Correlation ID: ${CORRELATION_ID}"
          echo "RHOAI version:  ${RHOAI_VERSION:-<unset>}"
          echo "FBC image:      ${FBC_IMAGE:-<unset>}"
          echo "Bundle image:   ${BUNDLE_IMAGE:-<unset>}"
          echo "Operator image: ${OPERATOR_IMAGE:-<unset>}"

      - name: Check configuration
        run: |
          MISSING=""
          [ -z "${JENKINS_BASE_URL}" ] && MISSING="${MISSING} vars.JENKINS_BASE_URL"
          [ -z "${{ secrets.JENKINS_USERNAME }}" ] && MISSING="${MISSING} secrets.JENKINS_USERNAME"
          [ -z "${{ secrets.JENKINS_TOKEN }}" ] && MISSING="${MISSING} secrets.JENKINS_TOKEN"
          if [ -n "${MISSING}" ]; then
            echo "::error::Not configured for Jenkins. Missing:${MISSING}"
            echo "Set these on this repository (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Get Jenkins crumb
        run: |
          # The credentials go in a --netrc-file rather than on the command
          # line: anything in argv is visible in the runner's process list,
          # and -u would also put it in a `set -x` trace.
          umask 077
          printf 'machine %s login %s password %s\n' \
            "$(echo "${JENKINS_BASE_URL}" | sed -E 's#^https?://##; s#/.*##')" \
            '${{ secrets.JENKINS_USERNAME }}' \
            '${{ secrets.JENKINS_TOKEN }}' > "${RUNNER_TEMP}/netrc"

          CRUMB=$(curl -sS -k --netrc-file "${RUNNER_TEMP}/netrc" \
            "${JENKINS_BASE_URL%/}/crumbIssuer/api/json" | jq -r '.crumb // empty')
          if [ -z "${CRUMB}" ]; then
            echo "::error::Could not get a Jenkins crumb. Check JENKINS_USERNAME / JENKINS_TOKEN."
            exit 1
          fi
          echo "::add-mask::${CRUMB}"
          echo "CRUMB=${CRUMB}" >> "${GITHUB_ENV}"

      - name: Trigger the Jenkins job
        id: trigger-jenkins
        run: |
          # RHOAI_VERSION, GITHUB_REPO and CORRELATION_ID are the three
          # parameters the devops/early-gate-tests job has always taken.
          #
          # OPERATOR_IMAGE, BUNDLE_IMAGE and FBC_IMAGE are new, and the
          # Jenkins job has to declare them before they do anything: Jenkins
          # discards parameters a job does not define, silently, with a 201
          # as if they had been accepted. Until that job is updated, the
          # smoke test will still install whatever RHOAI_VERSION resolves to
          # rather than the digest this gate built. That is the one remaining
          # mutable reference in the chain and it is on the Jenkins side.
          HTTP_CODE=$(curl -sS -k -o "${RUNNER_TEMP}/body.txt" -w '%{http_code}' \
            -D "${RUNNER_TEMP}/headers.txt" \
            --netrc-file "${RUNNER_TEMP}/netrc" \
            -X POST "${JENKINS_BASE_URL%/}/${JENKINS_JOB_PATH#/}/buildWithParameters" \
            -H "Jenkins-Crumb: ${CRUMB}" \
            --data-urlencode "RHOAI_VERSION=${RHOAI_VERSION}" \
            --data-urlencode "GITHUB_REPO=${REPOSITORIES}" \
            --data-urlencode "CORRELATION_ID=${CORRELATION_ID}" \
            --data-urlencode "PR_NUMBER=${PR_NUMBER}" \
            --data-urlencode "OPERATOR_IMAGE=${OPERATOR_IMAGE}" \
            --data-urlencode "BUNDLE_IMAGE=${BUNDLE_IMAGE}" \
            --data-urlencode "FBC_IMAGE=${FBC_IMAGE}")

          echo "Jenkins responded ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 400 ]; then
            echo "::error::Jenkins returned HTTP ${HTTP_CODE}"
            cat "${RUNNER_TEMP}/headers.txt"
            cat "${RUNNER_TEMP}/body.txt"
            exit 1
          fi

          QUEUE_URL=$(grep -i '^location:' "${RUNNER_TEMP}/headers.txt" \
            | sed 's/[Ll]ocation: *//; s/\r//; s|/$||' || true)
          if [ -z "${QUEUE_URL}" ]; then
            echo "::error::Jenkins accepted the build but returned no Location header, so there is no queue item to track."
            cat "${RUNNER_TEMP}/headers.txt"
            exit 1
          fi

          # Printed, not just set as an output. workflow_dispatch runs do not
          # expose job outputs over the REST API, so the Konflux task that
          # dispatched this run reads the queue URL back out of these logs.
          echo "Queue URL: ${QUEUE_URL}"
          echo "queue-url=${QUEUE_URL}" >> "${GITHUB_OUTPUT}"

      - name: Clean up credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/netrc"
