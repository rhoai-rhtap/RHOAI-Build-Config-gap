apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/RHOAI-Build-Config-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    # Unlike the push pipeline: a PR that gets force-pushed should abandon the
    # in-flight build rather than race it.
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files - same reason as the push pipeline, and doubly so
    # here: a PR build's image is expired after 5 days.
    #
    # Only bundle-affecting changes are worth a bundle build.  This repo also
    # carries catalog/, helm/ and config/, none of which reach bundle/Dockerfile.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request"
      && target_branch == "gap-poc"
      && ( "bundle/**".pathChanged()
           || ".tekton/rhod-operator-bundle-gap-pull-request.yaml".pathChanged() )
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhod-operator-bundle-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhod-operator-bundle-gap-on-pull-request
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # No additional-tags.  The release-shaped '{{target_branch}}-{{revision}}' tag
  # is a durable pointer; a PR build is a disposable check and gets exactly one
  # tag, which expires with the image.
  - name: output-image
    value: quay.io/redhat-user-workloads/rhoai-tenant/rhod-operator-bundle-gap:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  # No rhoai-version - see the push pipeline; rhoai-rhtap/konflux-central's
  # container-build.yaml does not declare the param.
  - name: dockerfile
    value: bundle/Dockerfile
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: build-source-image
    value: true
  - name: build-image-index
    value: false
  - name: build-args-file
    value: bundle/bundle_build_args.map
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main: gap-poc does not exist in konflux-central.
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhod-operator-bundle-gap
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
