apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/RHOAI-Build-Config-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files.  An FBC fragment is the
    # last link in the chain - nothing downstream of it needs nudging - and an
    # early-gate fragment is a throwaway validation of an ephemeral branch in any
    # case.  Block 3 hands its digest on as FBC_IMAGE_REF_BY_DIGEST instead.
    #
    # Two branch kinds, gated differently, for the same reasons set out at
    # length in rhod-operator-bundle-gap-push.yaml:
    #
    #   eg-fbc-*   requires an "early-gate:" commit subject and nothing else.
    #              Creating the branch is itself a push event, and a freshly
    #              forked branch inherits gap-poc's tip commit - whose subject is
    #              an ordinary merge message - so the subject is what separates
    #              "the gate pushed a processed catalog" from "the gate created a
    #              branch".  pathChanged() cannot do that job: on branch creation
    #              there is no meaningful diff base, and the processed push may
    #              legitimately change nothing.
    #              push-bundle-to-ephemeral-branch commits with --allow-empty and
    #              refuses any message not starting with "early-gate:", so the
    #              guarantee holds from both ends.
    #
    #   gap-poc    keeps the ordinary path-based trigger.
    #
    # eg-fbc-*, not eg-bundle-*, and the prefix is load-bearing.  Block 3 could
    # have reused Block 2's branch - defer-bundle-branch-cleanup exists for
    # exactly that - but the bundle PipelineRun's CEL fires on
    # target_branch.startsWith("eg-bundle-") with an "early-gate:" subject, which
    # is precisely the shape of Block 3's catalog push.  Sharing the branch would
    # mean every FBC push also rebuilt the bundle, and monitor-bundle-build in a
    # later run could latch onto the wrong one.  A separate prefix keeps the two
    # triggers disjoint by construction rather than by careful path matching.
    #
    # The release file's `files.all.exists(p, !p.matches('^catalog/catalog-patch\.yaml$'))`
    # clause is gone.  That clause is the interlock between the two release
    # stages: a Konflux nudge that touches only catalog-patch.yaml is meant to
    # trigger the GitHub Actions FBC processor, not a build.  The early gate has
    # no such split - one pipeline processes and then pushes, so every push here
    # is already post-processing.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && (
           ( target_branch.startsWith("eg-fbc-")
             && event_title.startsWith("early-gate:") )
           ||
           ( target_branch == "gap-poc"
             && ( "catalog/**".pathChanged()
                  || ".tekton/rhoai-fbc-fragment-gap-push.yaml".pathChanged() ) )
         )
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhoai-fbc-fragment-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhoai-fbc-fragment-gap-on-push
  namespace: rhoai-tenant
spec:
  # Generous but bounded.  A single-arch FBC fragment is one buildah run over a
  # ~41k-line catalog plus an `opm serve --cache-only`; the release file's 10h is
  # sized for four architectures and the full scan set, neither of which applies
  # here.  monitor-fbc-build's own budget has to cover this - see the arithmetic
  # on timeouts.pipeline in the operator repo's rhods-operator-gap-eg-build.yaml.
  timeouts:
    pipeline: 2h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # eg-fbc-<pipelinerun-uid> branches are deleted as soon as the gate finishes,
  # so the branch-qualified tag is what keeps the image reachable afterwards.
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  # eg- prefix matches what monitor-pac-build reconstructs when its image-tag
  # param is left empty.  Changing one means changing the other.
  #
  # The repository must be PUBLIC, for the same reason the bundle's had to be:
  # monitor-fbc-build resolves the digest it publishes as FBC_IMAGE_DIGEST
  # through quay.io's anonymous registry v2 token - the one lookup in the chain
  # that takes no credential.  Against a private repository the build would
  # still succeed and the monitor would still pass, because it warns rather than
  # fails when a digest will not resolve, and FBC_IMAGE_DIGEST and
  # FBC_IMAGE_REF_BY_DIGEST would come back empty.
  #
  # Deliberately not quay.io/rhoai/rhoai-fbc-fragment: that is the release
  # repository, and a fragment assembled from unmerged PRs must not land in it
  # under any tag.
  - name: output-image
    value: quay.io/redhat-user-workloads/rhoai-tenant/rhoai-fbc-fragment-gap:eg-{{revision}}
  # No rhoai-version and no build-type.  The release file passes both, but that
  # is against red-hat-data-services/konflux-central.  This pipeline resolves
  # against rhoai-rhtap/konflux-central, whose pipelines/fbc-fragment-build.yaml
  # declares neither - an undeclared param is a validation error, not an ignored
  # one.  Same trap the operator's EG PipelineRun hit with rhoai-version.
  - name: dockerfile
    value: Dockerfile
  # DR-F4.  One OCP version for the POC, and it has to be the one
  # fbc-processor's OPENSHIFT_VERSION param regenerates - the build reads
  # whatever is committed at this path, so a mismatch would build a stale
  # catalog and the gate would pass on it.
  - name: path-context
    value: catalog/v4.22
  - name: hermetic
    value: true
  # No prefetch-input: the catalog Dockerfile is a base image plus ADD and an
  # `opm serve --cache-only`, so cachi2 has nothing to prefetch and hermetic
  # costs nothing.
  #
  # TEMPORARY, paired with the same change in the operator repo's
  # rhods-operator-gap-eg-push.yaml and in rhod-operator-bundle-gap-push.yaml.
  # skip-checks drops fbc-fips-check-oci-ta, sast-shell-check,
  # sast-unicode-check, deprecated-base-image-check, validate-fbc and
  # fbc-target-index-pruning-check, each of which is
  # `when: $(params.skip-checks) in ["false"]` in fbc-fragment-build.yaml.
  #
  # Note what this costs, which is more than it costs for the other two:
  # validate-fbc is the task that would catch a structurally invalid catalog,
  # and verify-fbc-images in the gate pipeline checks image references, not opm
  # schema validity.  Safe for what Block 3 needs right now - FBC_IMAGE_DIGEST
  # and FBC_IMAGE_REF_BY_DIGEST come from the built manifest - but this is the
  # first thing to revert before this is used as a real gate.
  - name: skip-checks
    value: "true"
  # false while iterating - two fewer tasks, and nothing downstream reads either.
  - name: build-source-image
    value: false
  - name: build-image-index
    value: false
  # No build-platforms: fbc-fragment-build.yaml already defaults to
  # ['linux/x86_64'], which is the single arch this POC builds.
  - name: build-args-file
    value: catalog/catalog_build_args.map
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}'.  The release file can use
    # target_branch because rhoai-3.5 exists in both repos; gap-poc and the
    # ephemeral eg-fbc-* branches exist only here and would never resolve.
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/fbc-fragment-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhoai-fbc-fragment-gap
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
