apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/RHOAI-Build-Config-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files.  An FBC fragment is the
    # last link in the chain - nothing downstream of it needs nudging - and an
    # early-gate fragment is a throwaway validation of an ephemeral branch in any
    # case.  Block 3 hands its digest on as FBC_IMAGE_REF_BY_DIGEST instead.
    #
    # Two branch kinds, gated differently, for the same reasons set out at
    # length in rhod-operator-bundle-gap-push.yaml:
    #
    #   eg-fbc-*   requires an "early-gate:" commit subject and nothing else.
    #              Creating the branch is itself a push event, and a freshly
    #              forked branch inherits gap-poc's tip commit - whose subject is
    #              an ordinary merge message - so the subject is what separates
    #              "the gate pushed a processed catalog" from "the gate created a
    #              branch".  pathChanged() cannot do that job: on branch creation
    #              there is no meaningful diff base, and the processed push may
    #              legitimately change nothing.
    #              push-bundle-to-ephemeral-branch commits with --allow-empty and
    #              refuses any message not starting with "early-gate:", so the
    #              guarantee holds from both ends.
    #
    #   gap-poc    keeps the ordinary path-based trigger.
    #
    # eg-fbc-*, not eg-bundle-*, and the prefix is load-bearing.  Block 3 could
    # have reused Block 2's branch - defer-bundle-branch-cleanup exists for
    # exactly that - but the bundle PipelineRun's CEL fires on
    # target_branch.startsWith("eg-bundle-") with an "early-gate:" subject, which
    # is precisely the shape of Block 3's catalog push.  Sharing the branch would
    # mean every FBC push also rebuilt the bundle, and monitor-bundle-build in a
    # later run could latch onto the wrong one.  A separate prefix keeps the two
    # triggers disjoint by construction rather than by careful path matching.
    #
    # The gap-poc arm is rhoai-fbc-fragment-v3-5-push.yaml's expression with
    # nothing changed but the branch and file names, catalog-patch interlock
    # included: a Konflux nudge that touches only catalog-patch.yaml is meant to
    # trigger the FBC processor, not a build, and that is as true on gap-poc as
    # it is on rhoai-3.5.
    #
    # It is scoped to that arm rather than applied to the whole expression the
    # way the release file applies it, and that is not cosmetic.  `files.all`
    # is empty on a push that changes nothing, so `files.all.exists(...)` is
    # false - and push-fbc-to-ephemeral-branch commits with --allow-empty
    # precisely because a reprocessed catalog may be byte-identical.  Hoisting
    # the clause would silently drop exactly those runs.
    #
    # The Konflux onboarding file this replaces also added
    # `"bundle/Dockerfile".pathChanged()`.  Not kept: that followed from its
    # dockerfile: bundle/Dockerfile, which was the bundle's, not the catalog's.
    #
    # `\\.` in the matches() argument, not `\.`, and it is load-bearing.  This
    # is a YAML literal block, so the backslashes reach CEL exactly as written;
    # CEL then unescapes the string literal, and `\\` is how a regex `\.` is
    # spelled there.  A lone `\.` is not a CEL escape sequence at all, so the
    # expression fails to PARSE - and a parse failure is not scoped to the
    # clause it is in.  The whole annotation is unevaluable, both arms die with
    # it, and PaC skips the PipelineRun without registering a check-run, which
    # looks from the gate exactly like a build that never started.  Run 10 sat
    # in monitor-fbc-build on 6f17f90 with zero checks for this reason.
    # rhoai-fbc-fragment-v3-5-push.yaml has always had the two backslashes.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && (
           ( target_branch.startsWith("eg-fbc-")
             && event_title.startsWith("early-gate:") )
           ||
           ( target_branch == "gap-poc"
             && ( "catalog/**".pathChanged()
                  || ".tekton/rhoai-fbc-fragment-gap-push.yaml".pathChanged() )
             && files.all.exists(p, !p.matches('^catalog/catalog-patch\\.yaml$')) )
         )
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhoai-fbc-fragment-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhoai-fbc-fragment-gap-on-push
  namespace: rhoai-tenant
spec:
  # rhoai-fbc-fragment-v3-5-push.yaml's values, unchanged.  A 2h cap was
  # tempting - this build is single-arch with no scanners, so it has no business
  # taking ten hours - but a timeout is a ceiling, not a budget, and lowering it
  # buys nothing while adding a way for the gate to differ from release.  What
  # actually bounds the gate is monitor-fbc-build's fbc-build-timeout-minutes;
  # see the arithmetic on timeouts.pipeline in the operator repo's
  # rhods-operator-gap-eg-build.yaml.
  timeouts:
    pipeline: 10h
    tasks: 8h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # additional-tags used to carry '{{target_branch}}-{{revision}}' next to a
  # primary tag of eg-{{revision}}.  The primary tag below is now itself
  # branch-qualified, so the two coincide and a second copy would be the same
  # string applied twice.
  #
  # The repository must be PUBLIC, for the same reason the bundle's had to be:
  # monitor-fbc-build resolves the digest it publishes as FBC_IMAGE_DIGEST
  # through quay.io's anonymous registry v2 token - the one lookup in the chain
  # that takes no credential.  Against a private repository the build would
  # still succeed and the monitor would still pass, because it warns rather than
  # fails when a digest will not resolve, and FBC_IMAGE_DIGEST and
  # FBC_IMAGE_REF_BY_DIGEST would come back empty.
  #
  # Deliberately not quay.io/rhoai/rhoai-fbc-fragment: that is the release
  # repository, and a fragment assembled from unmerged PRs must not land in it
  # under any tag.  It is also private - 401 to an anonymous token - so the
  # monitor could not read it even if that rule did not exist.
  # pull-request-pipelines is public, is already where RHOAI puts non-release
  # build artifacts, and being a different repository it cannot collide with a
  # release digest whatever the tag says.
  #
  # That repo is shared between components, hence the component-name lead on
  # the tag.  The remainder is {{target_branch}}-{{revision}}: on a gate run the
  # first CEL arm above restricts target_branch to eg-fbc-<pipelinerun-uid>, so
  # this expands to rhoai-fbc-fragment-eg-fbc-<uid>-<40-char-sha> and the eg-
  # marker is enforced by the trigger rather than by convention.  Those branches
  # are deleted as soon as the gate finishes, so the tag is what keeps the image
  # addressable afterwards.
  #
  # The second CEL arm fires on gap-poc, which is not a gate run, and there the
  # same expression yields rhoai-fbc-fragment-gap-poc-<sha>.  That is the point
  # of deriving the tag from the branch rather than hardcoding "eg-": a plain
  # dev build does not get labelled as a gate artifact, and the monitor, which
  # only ever looks for the eg- form, cannot mistake one for the other.
  #
  # Length matters here more than elsewhere.  This pipeline is multi-platform-
  # shaped, so buildah pushes <tag>-linux-x86-64 and leaves build-image-index to
  # create the index carrying the plain tag.  Worst case is 19 + 7 + 36 + 1 + 40
  # = 103 characters, plus a 14-character platform suffix = 117, inside Quay's
  # 128-character tag limit but not by a wide margin.  Lengthening the component
  # prefix - "rhoai-fbc-fragment-gap-", say - would eat most of what is left.
  #
  # The component prefix is prod's Konflux component name - the same name as
  # the release repository, quay.io/rhoai/rhoai-fbc-fragment - not this fork's
  # Component name (rhoai-fbc-fragment-gap).  The gate's three blocks share one
  # repository, so the prefix is the only thing that says which of them an
  # image came from, and it should mean the same here as it does in prod.
  #
  # Changing this string means changing image-tag on monitor-fbc-build in
  # konflux-central's early-gate/early-gate-component-pipeline.yaml in the
  # same breath.  The monitor does not read the tag off the build; it
  # reconstructs it from the branch and commit and polls for it.  Out of
  # step, the build succeeds, the poll 404s six times, the monitor warns and
  # writes an empty digest, and the gate fails somewhere downstream on
  # "No ... image supplied" - pointing at the consumer rather than at the
  # tag.  That is run 13, and it cost a session to find.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:rhoai-fbc-fragment-{{target_branch}}-{{revision}}
  # No rhoai-version and no build-type.  The release file passes both, but that
  # is against red-hat-data-services/konflux-central.  This pipeline resolves
  # against rhoai-rhtap/konflux-central, whose pipelines/fbc-fragment-build.yaml
  # declares neither - an undeclared param is a validation error, not an ignored
  # one.  Same trap the operator's EG PipelineRun hit with rhoai-version.
  - name: dockerfile
    value: Dockerfile
  # DR-F4.  One OCP version for the POC, and it has to be the one
  # fbc-processor's OPENSHIFT_VERSION param regenerates - the build reads
  # whatever is committed at this path, so a mismatch would build a stale
  # catalog and the gate would pass on it.  Changing this means changing
  # fbc-openshift-version in konflux-central's early-gate pipeline too.
  #
  # v4.19, matching rhoai-fbc-fragment-v3-5-push.yaml, and not the v4.22 the
  # POC started with.  catalog/v4.22 in this fork does not build: five of its
  # channels have two heads each, which `opm serve --cache-only` rejects as an
  # invalid upgrade graph.
  #
  #   alpha, eus-2.25, fast, stable, stable-2.25
  #     multiple channel heads found in graph:
  #       rhods-operator.2.25.11, rhods-operator.2.25.8
  #
  # Pre-existing in the committed catalog, not something the gate introduces -
  # the same five channels are broken on gap-poc before any early-gate run
  # touches them, and the gate's regenerated copy changes image references
  # only, no channel entries.  v4.19, v4.20 and v4.21 are all clean.
  #
  # The task that catches this is validate-fbc, which skip-checks below had
  # disabled when run 11 hit it and no longer does.  verify-fbc-images in the
  # gate checks image references, not opm graph validity, so validate-fbc is
  # the only thing standing between a malformed catalog and a build failure.
  - name: path-context
    value: catalog/v4.19
  - name: hermetic
    value: true
  # No prefetch-input: the catalog Dockerfile is a base image plus ADD and an
  # `opm serve --cache-only`, so cachi2 has nothing to prefetch and hermetic
  # costs nothing.
  #
  # false, matching rhoai-fbc-fragment-v3-5-push.yaml.  This was "true" while
  # iterating on Blocks 1-3, which dropped fbc-fips-check-oci-ta,
  # sast-shell-check, sast-unicode-check, deprecated-base-image-check,
  # validate-fbc and fbc-target-index-pruning-check - each of them
  # `when: $(params.skip-checks) in ["false"]` in fbc-fragment-build.yaml.
  #
  # It cost more here than it did for the operator or the bundle.  validate-fbc
  # is the only task in the chain that checks opm schema and graph validity;
  # verify-fbc-images in the gate checks image references and nothing else.  So
  # with this on there was nothing between a malformed catalog and the build
  # that fails on it, which is exactly how run 11 died - the invalid v4.22
  # upgrade graph reached `opm serve --cache-only` because the task that would
  # have reported it had been switched off.
  #
  # Reverted first, ahead of the remaining temporary settings, for that reason.
  - name: skip-checks
    value: "false"
  # true, matching rhoai-fbc-fragment-v3-5-push.yaml.  false while iterating -
  # one fewer task, and nothing in the gate reads it.
  - name: build-source-image
    value: true
  # true, matching rhoai-fbc-fragment-v3-5-push.yaml.  This was false while
  # iterating, on the assumption it was as free here as it is for the bundle.
  # It is not, and the difference is the pipeline, not the parameter:
  #
  #   the bundle resolves through container-build.yaml, a single-platform
  #   buildah that pushes the plain tag directly, so dropping the index costs
  #   nothing and BUNDLE_IMAGE_DIGEST has always resolved;
  #
  #   the FBC resolves through fbc-fragment-build.yaml, which is
  #   multi-platform-shaped even at one platform.  It tags per platform and
  #   leaves build-image-index to create the index that carries the plain tag.
  #
  # So with this false the build pushed eg-<sha>-linux-x86-64 and the
  # branch-qualified additional-tag, and eg-<sha> - the exact tag
  # monitor-fbc-build reconstructs - never existed.  Run 13's FBC build
  # succeeded and the gate went green with FBC_IMAGE_DIGEST and
  # FBC_IMAGE_REF_BY_DIGEST both empty, which is DR-F7 unsatisfied.
  #
  # monitor-pac-build now fails on that instead of warning (require-digest),
  # so a regression here is loud rather than silent.
  - name: build-image-index
    value: true
  # The four platforms rhoai-fbc-fragment-v3-5-push.yaml builds.  Omitting
  # this is not neutral: fbc-fragment-build.yaml defaults build-platforms to
  # ['linux/x86_64'], so the gate was certifying a one-architecture catalog
  # fragment against a release that ships four.  An FBC fragment is per
  # architecture - the catalog pins image references, and a reference that
  # resolves on x86_64 is not evidence it resolves on s390x.
  #
  # linux/arm64 here, not the linux-m2xlarge/arm64 the operator push file
  # uses.  The two release files genuinely differ on that; each is copied as
  # it stands rather than reconciled.
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/ppc64le
    - linux/s390x
    - linux/arm64
  - name: build-args-file
    value: catalog/catalog_build_args.map
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  # The success message is the one that was actually firing.  share-fbc-details
  # was guarded on tasks.status alone, and a gate build succeeds - that being
  # the point - so every green run posted "a new CI build is available for
  # eg-fbc-<uuid>" to the team channel, naming a branch that is deleted
  # moments later.  Only the failure half had a switch; this is the other half.
  - name: enable-slack-success-notification
    value: "false"
  # No workflow_dispatch into red-hat-data-services from a gate build.
  #
  # conforma and smoke are gated on is_nightly, which this file never sets, so
  # they were already dormant - but dormant by default is not the same as off,
  # and the standing rule is that the gate triggers no release workflow at all.
  # trigger-disconnectec-installer-helper was not dormant: its guard reads
  # `is_nightly in ["true","false"]`, which is every value the param can hold,
  # so it dispatched rhods-disconnected-install-helper.yml on every FBC build
  # with branch_name set to the ephemeral eg-fbc-<uuid>.
  - name: enable-downstream-triggers
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}'.  The release file can use
    # target_branch because rhoai-3.5 exists in both repos; gap-poc and the
    # ephemeral eg-fbc-* branches exist only here and would never resolve.
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/fbc-fragment-build.yaml
  taskRunTemplate:
    # Not build-pipeline-rhoai-fbc-fragment-gap.  Konflux mints a Component's
    # push credential from that Component's containerImage, so the gap SA can
    # push to quay.io/redhat-user-workloads/rhoai-tenant/rhoai-fbc-fragment-gap
    # and nowhere else - against the output-image above it would 401 at push.
    #
    # This is the SA of the pull-request-pipelines Component, which already
    # holds a push credential for that repository, and which
    # odh-operator-pull-request.yaml uses for the same reason.
    serviceAccountName: build-pipeline-pull-request-pipelines
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
