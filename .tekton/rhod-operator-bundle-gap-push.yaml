apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/RHOAI-Build-Config-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files here, on purpose.  The
    # release bundle pipeline nudges catalog/catalog-patch.yaml so that FBC
    # picks up the digest it just built.  An early-gate bundle is a throwaway
    # validation of an ephemeral branch: it must never open a nudge PR, because
    # the image it names is deleted with the branch.  Block 3 gets the bundle
    # digest from the EG pipeline's BUNDLE_IMAGE_REF_BY_DIGEST result instead.
    #
    # The release file's `files.all.exists(p, !p.matches('^bundle/bundle-patch\.yaml$'))`
    # clause is also gone.  That clause is the interlock between the two release
    # stages - it suppresses the build when a Konflux nudge touched only
    # bundle-patch.yaml, because that push is meant to trigger the GitHub Actions
    # bundle processor, not a build.  The early gate has no such split: one
    # pipeline processes and then pushes, so every push here is already
    # post-processing.  Worse, `files.all` is empty on an empty commit, and an
    # all-quantifier over an empty set is true - but the clause still costs us
    # nothing to keep and nothing to drop, so it goes, because it describes a
    # stage boundary that does not exist in this repo.
    # The two branch kinds are gated differently, on purpose.
    #
    # An eg-bundle-* branch requires an "early-gate:" commit subject, and that
    # is the only thing it requires.  Creating the branch is itself a push
    # event, and PaC evaluated the old expression against it: forking
    # eg-bundle-<uid> off gap-poc started a build at 17:03 on a run whose
    # push-bundle-to-ephemeral-branch had not executed yet, so the build was of
    # unprocessed release content.  monitor-bundle-build would then have
    # latched onto that build and reported it as the gate's result.  A freshly
    # forked branch inherits gap-poc's tip commit, whose subject is an ordinary
    # merge message, so requiring the subject is what distinguishes "the gate
    # pushed processed content" from "the gate created a branch".
    # push-bundle-to-ephemeral-branch commits with --allow-empty and rejects
    # any commit-message that does not start with "early-gate:", so the
    # guarantee holds from both ends.
    #
    # pathChanged() cannot do this job: on branch creation there is no
    # meaningful diff base, and the processed push may legitimately change
    # nothing (the empty-commit case the push task exists to handle).
    #
    # gap-poc keeps the ordinary path-based trigger - it is a normal branch
    # where an "early-gate:" subject would be the unusual thing.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && (
           ( target_branch.startsWith("eg-bundle-")
             && event_title.startsWith("early-gate:") )
           ||
           ( target_branch == "gap-poc"
             && ( "bundle/**".pathChanged()
                  || ".tekton/rhod-operator-bundle-gap-push.yaml".pathChanged() ) )
         )
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhod-operator-bundle-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhod-operator-bundle-gap-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # eg-<pipelinerun-uid> branches are deleted as soon as the gate finishes, so
  # the branch-qualified tag is what keeps the image reachable afterwards.
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  # eg- prefix matches what monitor-pac-build in the early-gate pipeline
  # reconstructs when its image-tag param is left empty.  Changing one means
  # changing the other.
  #
  # rhod-operator-bundle-gap, not rhoda-.  Both Components exist and both are
  # bound to this repository; the difference that matters is registry
  # visibility.  monitor-bundle-build resolves the digest it hands to Block 3
  # through quay.io's anonymous registry v2 token, and rhoda-'s repository is
  # private:
  #
  #     rhoda-operator-bundle-gap   manifests/<tag> -> 401
  #     rhod-operator-bundle-gap    manifests/<tag> -> 404  (public, tag absent)
  #
  # Against the private one the build would still succeed and the monitor
  # would still pass - it warns rather than fails when a digest will not
  # resolve - but BUNDLE_IMAGE_DIGEST and BUNDLE_IMAGE_REF_BY_DIGEST would
  # come back empty, and those two results are the whole of DR-7.
  - name: output-image
    value: quay.io/redhat-user-workloads/rhoai-tenant/rhod-operator-bundle-gap:eg-{{revision}}
  # No rhoai-version param.  The release file passes one, but that is against
  # red-hat-data-services/konflux-central, whose container-build.yaml declares
  # it and forwards it to rhoai-init 0.1.  This pipeline resolves against
  # rhoai-rhtap/konflux-central, whose container-build.yaml declares no such
  # param and calls rhoai-init 0.2 with expected-cluster only - so there is
  # nothing to feed and nothing that demands it.
  - name: dockerfile
    value: bundle/Dockerfile
  - name: path-context
    value: .
  - name: hermetic
    value: true
  # No prefetch-input: bundle/Dockerfile is FROM scratch with COPY only, so
  # cachi2 has nothing to prefetch and hermetic costs nothing.
  - name: build-source-image
    value: true
  - name: build-image-index
    value: false
  - name: build-args-file
    value: bundle/bundle_build_args.map
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}'.  The release file can
    # use target_branch because rhoai-3.5 exists in both repos; gap-poc and the
    # ephemeral eg-bundle-* branches exist only here and would never resolve.
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-rhod-operator-bundle-gap
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
