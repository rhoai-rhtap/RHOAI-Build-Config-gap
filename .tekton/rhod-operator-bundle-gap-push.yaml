apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/rhoai-rhtap/RHOAI-Build-Config-gap?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build.appstudio.openshift.io/build-nudge-files here, on purpose.  The
    # release bundle pipeline nudges catalog/catalog-patch.yaml so that FBC
    # picks up the digest it just built.  An early-gate bundle is a throwaway
    # validation of an ephemeral branch: it must never open a nudge PR, because
    # the image it names is deleted with the branch.  Block 3 gets the bundle
    # digest from the EG pipeline's BUNDLE_IMAGE_REF_BY_DIGEST result instead.
    #
    # The release file's `files.all.exists(p, !p.matches('^bundle/bundle-patch\.yaml$'))`
    # clause is also gone.  That clause is the interlock between the two release
    # stages - it suppresses the build when a Konflux nudge touched only
    # bundle-patch.yaml, because that push is meant to trigger the GitHub Actions
    # bundle processor, not a build.  The early gate has no such split: one
    # pipeline processes and then pushes, so every push here is already
    # post-processing.  Worse, `files.all` is empty on an empty commit, and an
    # all-quantifier over an empty set is true - but the clause still costs us
    # nothing to keep and nothing to drop, so it goes, because it describes a
    # stage boundary that does not exist in this repo.
    # The two branch kinds are gated differently, on purpose.
    #
    # An eg-bundle-* branch requires an "early-gate:" commit subject, and that
    # is the only thing it requires.  Creating the branch is itself a push
    # event, and PaC evaluated the old expression against it: forking
    # eg-bundle-<uid> off gap-poc started a build at 17:03 on a run whose
    # push-bundle-to-ephemeral-branch had not executed yet, so the build was of
    # unprocessed release content.  monitor-bundle-build would then have
    # latched onto that build and reported it as the gate's result.  A freshly
    # forked branch inherits gap-poc's tip commit, whose subject is an ordinary
    # merge message, so requiring the subject is what distinguishes "the gate
    # pushed processed content" from "the gate created a branch".
    # push-bundle-to-ephemeral-branch commits with --allow-empty and rejects
    # any commit-message that does not start with "early-gate:", so the
    # guarantee holds from both ends.
    #
    # pathChanged() cannot do this job: on branch creation there is no
    # meaningful diff base, and the processed push may legitimately change
    # nothing (the empty-commit case the push task exists to handle).
    #
    # gap-poc keeps the ordinary path-based trigger - it is a normal branch
    # where an "early-gate:" subject would be the unusual thing.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && (
           ( target_branch.startsWith("eg-bundle-")
             && event_title.startsWith("early-gate:") )
           ||
           ( target_branch == "gap-poc"
             && ( "bundle/**".pathChanged()
                  || ".tekton/rhod-operator-bundle-gap-push.yaml".pathChanged() ) )
         )
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhod-operator-bundle-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhod-operator-bundle-gap-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # additional-tags used to carry '{{target_branch}}-{{revision}}' next to a
  # primary tag of eg-{{revision}}.  The primary tag below is now itself
  # branch-qualified, so the two coincide and a second copy would be the same
  # string applied twice.
  #
  # The repository must be PUBLIC.  monitor-bundle-build resolves the digest it
  # hands to Block 3 through quay.io's anonymous registry v2 token - the one
  # lookup in the chain that takes no credential.  Against a private repository
  # the build would still succeed and the monitor would still pass, because it
  # warns rather than fails when a digest will not resolve, but
  # BUNDLE_IMAGE_DIGEST and BUNDLE_IMAGE_REF_BY_DIGEST would come back empty,
  # and those two results are the whole of DR-7.
  #
  # That requirement is what rules out quay.io/rhoai/odh-operator-bundle: the
  # release repository answers an anonymous token with 401, so the monitor
  # could not see the image at all.  pull-request-pipelines is public, is
  # already where RHOAI puts non-release build artifacts, and being a different
  # repository it cannot collide with a release digest whatever the tag says.
  #
  # That repo is shared between components, hence the component-name lead on
  # the tag.  The remainder is {{target_branch}}-{{revision}}: on a gate run the
  # first CEL arm above restricts target_branch to eg-bundle-<pipelinerun-uid>,
  # so this expands to odh-operator-bundle-eg-bundle-<uid>-<40-char-sha> and the
  # eg- marker is enforced by the trigger rather than by convention.  Those
  # branches are deleted as soon as the gate finishes, so the tag is what keeps
  # the image addressable afterwards.
  #
  # The second CEL arm fires on gap-poc, which is not a gate run, and there the
  # same expression yields odh-operator-bundle-gap-poc-<sha>.  That is the point
  # of deriving the tag from the branch rather than hardcoding "eg-": a plain
  # dev build does not get labelled as a gate artifact, and the monitor, which
  # only ever looks for the eg- form, cannot mistake one for the other.
  #
  # The component prefix is prod's Konflux component name - the same name as
  # the release repository, quay.io/rhoai/odh-operator-bundle - not this fork's
  # Component name (rhod-operator-bundle-gap).  The gate's three blocks share one
  # repository, so the prefix is the only thing that says which of them an
  # image came from, and it should mean the same here as it does in prod.
  #
  # Changing this string means changing image-tag on monitor-bundle-build in
  # konflux-central's early-gate/early-gate-component-pipeline.yaml in the
  # same breath.  The monitor does not read the tag off the build; it
  # reconstructs it from the branch and commit and polls for it.  Out of
  # step, the build succeeds, the poll 404s six times, the monitor warns and
  # writes an empty digest, and the gate fails somewhere downstream on
  # "No ... image supplied" - pointing at the consumer rather than at the
  # tag.  That is run 13, and it cost a session to find.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-bundle-{{target_branch}}-{{revision}}
  # No rhoai-version param.  The release file passes one, but that is against
  # red-hat-data-services/konflux-central, whose container-build.yaml declares
  # it and forwards it to rhoai-init 0.1.  This pipeline resolves against
  # rhoai-rhtap/konflux-central, whose container-build.yaml declares no such
  # param and calls rhoai-init 0.2 with expected-cluster only - so there is
  # nothing to feed and nothing that demands it.
  - name: dockerfile
    value: bundle/Dockerfile
  - name: path-context
    value: .
  - name: hermetic
    value: true
  # No prefetch-input: bundle/Dockerfile is FROM scratch with COPY only, so
  # cachi2 has nothing to prefetch and hermetic costs nothing.
  #
  # TEMPORARY, paired with the same change in the operator repo's
  # rhods-operator-gap-eg-push.yaml.  Run 4's bundle build took 20 minutes
  # (02:42:10Z -> 03:02:51Z) for a FROM-scratch image that copies a handful of
  # YAML files: essentially all of it was the scanners.  skip-checks drops
  # clair-scan, sast-snyk-check, clamav-scan, sast-shell-check,
  # sast-unicode-check, deprecated-base-image-check,
  # ecosystem-cert-preflight-checks and rpms-signature-scan, each of which is
  # `when: $(params.skip-checks) in ["false"]` in container-build.yaml.
  #
  # Safe for what Block 2 and Block 3 need: BUNDLE_IMAGE_DIGEST and
  # BUNDLE_IMAGE_REF_BY_DIGEST come from the built manifest, not from any
  # scan result.  Revert before this is used as a real gate.
  - name: skip-checks
    value: "true"
  # false while iterating - one less task, and nothing downstream reads the
  # source image.
  - name: build-source-image
    value: false
  - name: build-image-index
    value: false
  - name: build-args-file
    value: bundle/bundle_build_args.map
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/rhoai-rhtap/konflux-central.git
    # Pinned to main rather than '{{ target_branch }}'.  The release file can
    # use target_branch because rhoai-3.5 exists in both repos; gap-poc and the
    # ephemeral eg-bundle-* branches exist only here and would never resolve.
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/container-build.yaml
  taskRunTemplate:
    # Not build-pipeline-rhod-operator-bundle-gap.  Konflux mints a Component's
    # push credential from that Component's containerImage, so the gap SA can
    # push to quay.io/redhat-user-workloads/rhoai-tenant/rhod-operator-bundle-gap
    # and nowhere else - against the output-image above it would 401 at push.
    #
    # This is the SA of the pull-request-pipelines Component, which already
    # holds a push credential for that repository, and which
    # odh-operator-pull-request.yaml uses for the same reason.
    serviceAccountName: build-pipeline-pull-request-pipelines
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
