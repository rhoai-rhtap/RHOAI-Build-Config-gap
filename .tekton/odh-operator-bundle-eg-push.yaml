apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/RHOAI-Build-Config?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # No build-nudge-files: an EG bundle is a throwaway on an ephemeral branch and must never open a nudge PR
    # The eg-bundle-* arm requires an "early-gate:" subject, so forking the branch cannot itself start a build
    # TODO(prod): the second arm matches gap-poc, which does not exist in
    # red-hat-data-services/RHOAI-Build-Config. It is dead rather than harmful
    # there, but repointing it at a release branch would race the release build -
    # decide deliberately whether to drop the arm or give it a real branch.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push"
      && (
           ( target_branch.startsWith("eg-bundle-")
             && event_title.startsWith("early-gate:") )
           ||
           ( target_branch == "gap-poc"
             && ( "bundle/**".pathChanged()
                  || ".tekton/odh-operator-bundle-eg-push.yaml".pathChanged() ) )
         )
  # TODO(prod): Konflux Components are immutable, so these three cannot be renamed.
  # A dedicated early-gate Component has to be created in the production tenant and
  # the application/component/name below set to it. bundle-build-check-name in
  # konflux-central's early-gate pipeline must be changed to match in the same breath.
  labels:
    appstudio.openshift.io/application: gap-poc
    appstudio.openshift.io/component: rhod-operator-bundle-gap
    pipelines.appstudio.openshift.io/type: build
  name: rhod-operator-bundle-gap-on-push
  namespace: rhoai-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  # Shared public repo, tagged with prod's component prefix; monitor-bundle-build
  # reconstructs this tag rather than reading it off the build, so output-image here
  # and image-tag on monitor-bundle-build must stay character-for-character in step.
  - name: output-image
    value: quay.io/rhoai/pull-request-pipelines:odh-operator-bundle-{{target_branch}}-{{revision}}
  # TODO(prod): no rhoai-version param. red-hat-data-services/konflux-central's
  # container-build.yaml declares one and forwards it to rhoai-init, and the release
  # file passes it - confirm whether the early gate should too.
  - name: dockerfile
    value: bundle/Dockerfile
  - name: path-context
    value: .
  - name: hermetic
    value: true
  # No prefetch-input (bundle/Dockerfile is FROM scratch) and no skip-checks, both
  # matching odh-operator-bundle-v3-5-push.yaml, so the gate scans what release scans.
  - name: build-source-image
    value: true
  # false, matching the release file: container-build.yaml pushes the plain tag, so there is no index
  - name: build-image-index
    value: false
  # No build-platforms: container-build.yaml declares none, and the bundle is single-arch in release too
  - name: build-args-file
    value: bundle/bundle_build_args.map
  # A failed gate build is a signal to the gate, not to the release team.
  - name: enable-slack-failure-notification
    value: "false"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    # Pinned to main: the ephemeral eg-bundle-* branches exist only in this repo and would never resolve
    - name: revision
      value: 'main'
    - name: pathInRepo
      value: pipelines/container-build.yaml
  taskRunTemplate:
    # Not the Component's own SA. Konflux scopes a Component's push credential to that
    # Component's containerImage, so only the pull-request-pipelines SA can push here.
    serviceAccountName: build-pipeline-pull-request-pipelines
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
